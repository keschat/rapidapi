<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>POS Demo</title>
    <style>
        .flash {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid;
        }
        .flash.success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
        }
        .flash.error {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>POS Demo</h1>

    <div th:if="${flash}" th:class="'flash ' + ${flash.type}" th:text="${flash.message}"></div>

    <form action="/pos-demo" method="post">
        <button type="submit">Add a flash message</button>
    </form>
</body>
</html>
